# 앱 빌드 — 실기기 검증용 APK + (손으로 고를 때만) Play 업로드용 AAB
#
# ── APK: `bitpet_app/**` 가 푸시되면 자동 ─────────────────────────────────────
# 릴리즈 APK 를 만들어 GitHub 아티팩트로 올린다. 폰에서 받아 바로 설치하면 된다.
# **디버그 키**로 서명되어 Play 는 거부한다 (`android/app/build.gradle.kts` 의 폴백).
# 검증용이라 그걸로 충분하고, 그래서 이 경로에는 릴리즈 키가 아예 안 들어온다.
#
# ── AAB: Actions 탭 > app-build > Run workflow 에서 `build` 를 aab/both 로 ──────
# 업로드 키로 서명된 AAB 를 아티팩트로 올린다. **푸시로는 절대 돌지 않는다** —
# 키가 러너에 풀리는 순간을 사람이 고른 실행으로만 줄이려는 것이다.
# 주소는 고른 값과 상관없이 운영(`tailog.me`)으로 고정한다. 스토어에 로컬 주소가
# 박힌 앱이 올라가는 사고를 막는다.
#
# 키를 CI 에 둬도 되는 이유: Play 앱 서명을 쓰므로 진짜 서명 키는 Google 이 갖고,
# 여기 두는 건 **업로드 키**다. 유출·분실돼도 Play 콘솔에서 재설정할 수 있다.
#
# 서버(`deploy.yml`)와 달리 **자동 배포가 아니다.** 앱은 한 번 나가면 되돌릴 수
# 없고 (이미 설치된 폰을 되돌리지 못한다) 중간에 Play 심사가 끼므로, 스토어
# 업로드는 사람이 AAB 를 받아 손으로 한다.
#
# ── 준비: GitHub Secrets ────────────────────────────────────────────────────
# 전부 gitignore 된 파일·값이라 레포에 없다. 없으면 빌드가 실패한다.
#
#   GOOGLE_SERVICES_JSON   ← bitpet_app/android/app/google-services.json   (APK·AAB)
#   FIREBASE_OPTIONS_DART  ← bitpet_app/lib/firebase_options.dart          (APK·AAB)
#   ANDROID_KEYSTORE_BASE64   ← 업로드 키 .jks 파일의 base64               (AAB 만)
#   ANDROID_KEYSTORE_PASSWORD ← key.properties 의 storePassword             (AAB 만)
#   ANDROID_KEY_ALIAS         ← key.properties 의 keyAlias                  (AAB 만)
#   ANDROID_KEY_PASSWORD      ← key.properties 의 keyPassword               (AAB 만)
#
# Firebase 2개는 파일 내용을 그대로 붙여넣어도 되고, base64 로 넣어도 된다 — 워크플로가 둘 다 받는다.
# .jks 는 바이너리라 반드시 base64. 나머지 셋은 값만 그대로.
#   레포 > Settings > Secrets and variables > Actions > New repository secret
#
# base64 로 넣고 싶다면 PowerShell 에서:
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("bitpet_app\android\app\google-services.json")) | Set-Clipboard
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("bitpet_app\lib\firebase_options.dart"))        | Set-Clipboard
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("<key.properties 의 storeFile 경로>")) | Set-Clipboard

name: app-build

on:
  push:
    paths:
      - 'bitpet_app/**'
      - '.github/workflows/app-build.yml'
  # 코드 변경 없이 서버 주소만 바꿔 다시 뽑고 싶을 때, 그리고 AAB 를 뽑을 때
  workflow_dispatch:
    inputs:
      build:
        description: '무엇을 빌드할지 (aab 는 업로드 키로 서명, 주소는 운영 고정)'
        required: true
        default: 'apk'
        type: choice
        options:
          - 'apk'    # 실기기 검증용 (디버그 키)
          - 'aab'    # Play 업로드용
          - 'both'
      build_number:
        description: 'AAB 빌드 번호(versionCode). 비우면 pubspec 값. Play 에 올린 적 있는 번호보다 커야 함'
        required: false
        default: ''
        type: string
      api_base_url:
        description: 'API 서버 주소 (APK 만 해당)'
        required: true
        default: 'https://tailog.me/api/v1'
        type: choice
        options:
          - 'https://tailog.me/api/v1'       # 운영 서버 (기본)
          - 'http://localhost:8080/api/v1'   # 로컬. adb reverse tcp:8080 tcp:8080 필요

# 같은 브랜치에 연속으로 푸시하면 앞의 빌드는 볼 일이 없다.
# 손으로 돌린 실행(AAB)은 따로 묶는다 — 그 사이 푸시가 들어와도 취소되지 않게.
concurrency:
  group: app-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 푸시로 돌 때는 inputs 가 비어 있다 → apk
      BUILD: ${{ inputs.build || 'apk' }}
    steps:
      - uses: actions/checkout@v4

      # 시크릿이 비어 있으면 Gradle 이 한참 뒤에 알아보기 힘든 에러를 낸다.
      # 여기서 먼저 잡고 무엇을 넣어야 하는지 알려준다.
      - name: 시크릿 확인
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FO: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          # `[ ... ] && ...` 로 쓰지 않는다. Actions 의 기본 셸은 `bash -e` 라
          # 조건이 거짓이면 그 줄의 종료코드가 1이 되어 **시크릿이 멀쩡할 때**
          # 스텝이 실패한다. if 문은 조건이 거짓이어도 0을 돌려준다.
          missing=""
          if [ -z "$GS" ]; then missing="$missing GOOGLE_SERVICES_JSON"; fi
          if [ -z "$FO" ]; then missing="$missing FIREBASE_OPTIONS_DART"; fi
          if [ -n "$missing" ]; then
            echo "::error::등록되지 않은 시크릿:$missing — 이 워크플로 파일 맨 위 주석에 넣는 방법이 있다."
            exit 1
          fi

      # gitignore 된 Firebase 설정 2개를 시크릿에서 복원한다.
      # 둘은 같은 값을 다른 형식으로 담고 있어 하나만 갱신하면 어긋난다.
      #
      # base64 로 넣든 파일 내용을 그대로 붙여넣든 둘 다 받는다. 넣는 사람이
      # 어느 쪽으로 했는지 기억할 필요가 없어야 하고, 틀렸을 때 나오는 게
      # `base64: invalid input` 한 줄이라 원인이 안 보인다.
      - name: Firebase 설정 복원
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FO: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          # 디코드를 임시 파일에 받는다. base64 는 실패하기 전까지 쓴 만큼은
          # 뱉고 죽어서, 목적지에 바로 쓰면 반쯤 깨진 파일이 남는다.
          restore() {
            local value="$1" dest="$2" must_contain="$3"
            if printf '%s' "$value" | tr -d '[:space:]' | base64 -d > /tmp/restore.tmp 2>/dev/null; then
              mv /tmp/restore.tmp "$dest"
              echo "$dest — base64 로 디코드"
            else
              printf '%s' "$value" > "$dest"
              echo "$dest — 원문 그대로"
            fi
            # 실제로 그 파일이 맞는지 본다. 엉뚱한 값을 넣었으면 여기서 잡히고,
            # 안 그러면 Gradle 이 한참 뒤에 알아보기 힘든 에러를 낸다.
            if ! grep -q "$must_contain" "$dest"; then
              # 값은 절대 찍지 않는다. 어느 파일이 어디로 들어갔는지 가려낼
              # 만큼만 본다 — 이게 없으면 "복원 실패" 다섯 글자만 남는다.
              echo "── 진단 ──────────────────────────────"
              echo "크기          : $(wc -c < "$dest") bytes"
              echo "JSON 처럼 시작 : $(head -c 1 "$dest" | grep -q '{' && echo yes || echo no)"
              echo "project_id    : $(grep -qs 'project_id'           "$dest" && echo 있음 || echo 없음)"
              echo "DefaultFirebaseOptions : $(grep -qs 'DefaultFirebaseOptions' "$dest" && echo 있음 || echo 없음)"
              echo "──────────────────────────────────────"
              echo "위 두 줄에서 반대쪽 파일의 표시가 '있음' 이면 두 시크릿을 서로 바꿔 넣은 것이다."
              echo "::error::$dest 복원 실패 — '$must_contain' 이 없다."
              exit 1
            fi
          }
          restore "$GS" bitpet_app/android/app/google-services.json 'project_id'
          restore "$FO" bitpet_app/lib/firebase_options.dart        'DefaultFirebaseOptions'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'          # build.gradle.kts 의 sourceCompatibility 와 맞춘다
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'   # 로컬과 같은 버전으로 고정. 채널만 맞추면 어느 날 조용히 갈린다
          channel: stable
          cache: true

      - name: 의존성 받기
        working-directory: bitpet_app
        run: flutter pub get

      # arm64 하나만 뽑는다. 통짜 APK 는 x86·armv7 까지 넣어 두 배 가까이 커지는데,
      # 검증에 쓰는 실기기는 전부 arm64 다. 에뮬레이터(x86)로 볼 일이 생기면
      # 이 줄에서 --target-platform 을 빼면 된다.
      # 주소는 컴파일 시점에 상수로 박힌다(`String.fromEnvironment`). 앱 안에서
      # 고를 수 있는 값이 아니라, 주소가 다르면 APK 자체가 다른 물건이다.
      #
      # `||` 뒤는 **푸시로 자동 실행될 때** 쓰이는 기본값이다 — 그 경우 inputs 가
      # 비어 있다. 자동 빌드의 기본값을 바꾸려면 여기와 위 workflow_dispatch 의
      # `default:` 를 **둘 다** 고쳐야 한다. 한쪽만 고치면 손으로 돌릴 때와
      # 푸시로 돌 때가 서로 다른 주소로 나온다.
      - name: APK 빌드
        if: env.BUILD != 'aab'
        working-directory: bitpet_app
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --dart-define=API_BASE_URL='${{ inputs.api_base_url || 'https://tailog.me/api/v1' }}'

      # 커밋만으로는 부족하다. 같은 커밋에서 주소만 다른 APK 가 나오는데 이름이
      # 같으면 받아놓고 어느 쪽인지 알 수 없다 (실제로 한 번 헷갈렸다).
      - name: 이름 붙이기
        if: env.BUILD != 'aab'
        id: name
        env:
          URL: ${{ inputs.api_base_url || 'https://tailog.me/api/v1' }}
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          case "$URL" in
            *localhost*) echo "env=local" >> "$GITHUB_OUTPUT" ;;
            *)           echo "env=prod"  >> "$GITHUB_OUTPUT" ;;
          esac
          echo "이 APK 가 보는 서버: $URL"

      - uses: actions/upload-artifact@v4
        if: env.BUILD != 'aab'
        with:
          name: tailog-${{ steps.name.outputs.env }}-${{ steps.name.outputs.short }}
          path: bitpet_app/build/app/outputs/flutter-apk/app-release.apk
          # 검증용이라 오래 둘 이유가 없다. 기본 90일은 저장소만 먹는다.
          retention-days: 14

      # ── 여기부터 AAB (손으로 aab/both 를 골랐을 때만) ─────────────────────────

      # 업로드 키를 복원한다. 값은 어디에도 찍지 않는다 — 파일로만 쓰고 끝나면 지운다.
      # storeFile 은 `file(it)` 이라 android/app 기준 상대 경로다.
      - name: 업로드 키 복원
        if: env.BUILD != 'apk'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          if [ -z "$KS" ]; then missing="$missing ANDROID_KEYSTORE_BASE64"; fi
          if [ -z "$SP" ]; then missing="$missing ANDROID_KEYSTORE_PASSWORD"; fi
          if [ -z "$KA" ]; then missing="$missing ANDROID_KEY_ALIAS"; fi
          if [ -z "$KP" ]; then missing="$missing ANDROID_KEY_PASSWORD"; fi
          if [ -n "$missing" ]; then
            echo "::error::등록되지 않은 시크릿:$missing — 이 워크플로 파일 맨 위 주석에 넣는 방법이 있다."
            exit 1
          fi
          if ! printf '%s' "$KS" | tr -d '[:space:]' | base64 -d > bitpet_app/android/app/upload-keystore.jks 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 가 base64 가 아니다. .jks 파일을 base64 로 바꿔 넣어야 한다."
            exit 1
          fi
          # .properties 는 역슬래시를 이스케이프 문자로 읽는다
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$(esc "$SP")"
            echo "keyAlias=$(esc "$KA")"
            echo "keyPassword=$(esc "$KP")"
          } > bitpet_app/android/key.properties

      - name: AAB 빌드
        if: env.BUILD != 'apk'
        working-directory: bitpet_app
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          extra=""
          if [ -n "$BUILD_NUMBER" ] && ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::빌드 번호는 숫자만: $BUILD_NUMBER"; exit 1
          fi
          if [ -n "$BUILD_NUMBER" ]; then extra="--build-number=$BUILD_NUMBER"; fi
          flutter build appbundle --release $extra \
            --dart-define=API_BASE_URL='https://tailog.me/api/v1'

      # key.properties 가 깨져 있으면 Gradle 은 디버그 키로 폴백하고 **경고만** 낸다.
      # 그 AAB 는 Play 에서야 거부되므로 여기서 서명자를 보고 끊는다.
      - name: 서명 확인 + 이름 붙이기
        if: env.BUILD != 'apk'
        id: aab
        working-directory: bitpet_app
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          owner=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -m1 'Owner:' || true)
          echo "서명자: $owner"
          if [ -z "$owner" ] || echo "$owner" | grep -q 'Android Debug'; then
            echo "::error::AAB 가 업로드 키로 서명되지 않았다 (디버그 키 또는 서명 없음). 시크릿 값을 확인할 것."
            exit 1
          fi
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          code="$BUILD_NUMBER"
          if [ -z "$code" ]; then code=$(grep -m1 '^version:' pubspec.yaml | sed 's/.*+//'); fi
          echo "label=$version-$code-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "버전: $version ($code)"

      - uses: actions/upload-artifact@v4
        if: env.BUILD != 'apk'
        with:
          name: tailog-aab-${{ steps.aab.outputs.label }}
          path: bitpet_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      # 러너는 매번 버려지지만, 키 파일은 쓸 일이 끝나면 바로 지운다.
      - name: 업로드 키 지우기
        if: always()
        run: rm -f bitpet_app/android/app/upload-keystore.jks bitpet_app/android/key.properties
