name: bitpet_app
description: "tailog — 반려 파충류 사육자를 위한 개체 관리 및 커뮤니티 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # 머티리얼 위젯(날짜 선택 모달 등) 한국어/영어 번역 — 기기 언어를 따른다
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 상태 관리
  flutter_riverpod: ^2.5.1

  # HTTP
  dio: ^5.4.3

  # 이미지 선택 (갤러리) — 프로필·갤러리·커뮤니티 사진 업로드
  image_picker: ^1.1.2

  # 안전 저장소 (JWT)
  flutter_secure_storage: ^9.2.2

  # 로컬 DB (Local-First)
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.25
  path_provider: ^2.1.4
  path: ^1.9.0

  # 라우팅
  go_router: ^14.3.0

  # 유틸
  intl: ^0.20.2

  # 캘린더 (개체 상세 캘린더 탭)
  table_calendar: ^3.1.2

  # SVG 아이콘 — assets/icons 의 커스텀 아이콘 세트를 그린다.
  # 모든 아이콘은 stroke/fill 이 currentColor 라서 AppIcons 가 넘기는 색이 그대로 먹는다.
  flutter_svg: ^2.0.10

  # FCM 푸시 (Firebase 프로젝트 ID: tailog-bba42)
  # 상한 없이 하한만 지정 — AGP 9 대응 최신 버전을 받도록. `flutter pub get` 후
  # pubspec.lock 에 잡힌 버전으로 캐럿(^) 고정해도 된다.
  firebase_core: '>=3.6.0'
  firebase_messaging: '>=15.1.0'
  # 포그라운드에서 알림을 직접 띄우기 위해 필요 (OS가 자동으로 띄워주지 않음)
  flutter_local_notifications: '>=18.0.0'

  # NFC — NDEF(URL) 읽기 전용. UID는 쓰지 않는다.
  # 앱 내 스캔 시트가 필요한 진짜 이유는 '읽기'가 아니라 '선점'이다. 앱이 떠 있는 상태에서
  # 태그를 탭하면 OS가 App Link 인텐트를 쏴서 현재 화면을 개체 상세로 갈아엎는다
  # (부모 개체를 고르던 중에 그 개체 상세로 튕겨나간다). 리더 모드를 켜두면 그 인텐트가
  # 우리 콜백으로 대신 들어온다 — core/nfc/NfcReader 참고.
  #
  # 4.x는 API가 갈아엎어졌다(NfcManager.instance.startSession 시그니처 변경).
  # 3.x API로 작성했으므로 상한을 막아둔다.
  nfc_manager: '>=3.5.0 <4.0.0'

  # 외부 링크 열기 (스마트스토어, 문의 메일 등)
  # ⚠️ Android 11+ 는 패키지 가시성 제한 때문에 AndroidManifest 의 <queries> 항목이
  #    없으면 canLaunchUrl 이 항상 false 를 돌려준다 — 매니페스트도 같이 봐야 한다.
  url_launcher: ^6.3.0

  # 앱 버전 표시 (마이페이지 > 앱 정보)
  # pubspec 의 version 을 빌드 시점에 읽어온다. 화면에 상수로 박아두면 배포할 때마다
  # 손으로 고쳐야 하고, 한 번 까먹으면 화면에 거짓 버전이 뜬 채로 나간다.
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.3
  # 런처 아이콘 생성 — 원본은 assets/branding, 생성물은 android/ios 리소스 폴더
  # 아이콘을 바꾼 뒤엔 `dart run flutter_launcher_icons` 를 다시 돌려야 반영된다
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/branding/

  # 본문 글꼴 — Pretendard (SIL OFL 1.1, assets/fonts/LICENSE.txt)
  #
  # TTF 가 아니라 OTF 를 넣은 이유는 용량이다. 같은 글꼴인데 TTF 는 한 벌에 2.7MB,
  # OTF 는 1.57MB — 네 벌이면 4MB 넘게 차이 난다.
  #
  # 다섯 벌만 넣는다: 400 본문 / 500 / 600 리스트 제목 / 700 화면 제목 / 800 히어로.
  # 실제로 코드에서 쓰는 굵기가 이 다섯 개뿐이다 (w900·w300 은 한 곳도 없다).
  # 새 굵기를 쓰기 전에 파일부터 추가할 것 — 없는 굵기는 가장 가까운 것으로 떨어져
  # 의도한 대비가 안 나온다.
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800

# 런처 아이콘 설정 (원본 3072px, assets/branding)
flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: true
  # 안드로이드 적응형 아이콘 — 배경은 로고 바탕색, 전경은 여백 있는 투명 PNG
  adaptive_icon_background: "#F4FBF6"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true   # 앱스토어는 알파 채널 있는 아이콘을 거부한다
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#F4FBF6"
    theme_color: "#5FCFA0"
