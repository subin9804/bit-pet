name: bitpet_app
description: "tailog — 반려 파충류 사육자를 위한 개체 관리 및 커뮤니티 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 상태 관리
  flutter_riverpod: ^2.5.1

  # HTTP
  dio: ^5.4.3

  # 이미지 선택 (갤러리) — 프로필·갤러리·커뮤니티 사진 업로드
  image_picker: ^1.1.2

  # 안전 저장소 (JWT)
  flutter_secure_storage: ^9.2.2

  # 로컬 DB (Local-First)
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.25
  path_provider: ^2.1.4
  path: ^1.9.0

  # 라우팅
  go_router: ^14.3.0

  # 유틸
  intl: ^0.20.2

  # 캘린더 (개체 상세 캘린더 탭)
  table_calendar: ^3.1.2

  # 폰트
  google_fonts: ^6.2.1

  # FCM 푸시 (Firebase 프로젝트 ID: tailog-bba42)
  # 상한 없이 하한만 지정 — AGP 9 대응 최신 버전을 받도록. `flutter pub get` 후
  # pubspec.lock 에 잡힌 버전으로 캐럿(^) 고정해도 된다.
  firebase_core: '>=3.6.0'
  firebase_messaging: '>=15.1.0'
  # 포그라운드에서 알림을 직접 띄우기 위해 필요 (OS가 자동으로 띄워주지 않음)
  flutter_local_notifications: '>=18.0.0'

  # NFC — NDEF(URL) 읽기 전용. UID는 쓰지 않는다.
  # 앱 내 스캔 시트가 필요한 진짜 이유는 '읽기'가 아니라 '선점'이다. 앱이 떠 있는 상태에서
  # 태그를 탭하면 OS가 App Link 인텐트를 쏴서 현재 화면을 개체 상세로 갈아엎는다
  # (부모 개체를 고르던 중에 그 개체 상세로 튕겨나간다). 리더 모드를 켜두면 그 인텐트가
  # 우리 콜백으로 대신 들어온다 — core/nfc/NfcReader 참고.
  #
  # 4.x는 API가 갈아엎어졌다(NfcManager.instance.startSession 시그니처 변경).
  # 3.x API로 작성했으므로 상한을 막아둔다.
  nfc_manager: '>=3.5.0 <4.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - google_fonts/
