# tailog.me — 리버스 프록시 + HTTPS 종단
#
# ⚠️ 최초 실행 시에는 아직 인증서가 없어 443 블록이 nginx 기동을 실패시킨다.
#    README 의 "최초 인증서 발급" 순서를 따를 것 (80 블록만으로 먼저 띄운 뒤 발급).

server {
    listen 80;
    listen [::]:80;
    server_name tailog.me www.tailog.me;

    # Let's Encrypt 도전 응답. 이 경로만 평문으로 열어두고 나머지는 전부 https 로 보낸다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tailog.me www.tailog.me;

    ssl_certificate     /etc/letsencrypt/live/tailog.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tailog.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 사진 업로드가 있으므로 기본값 1M 로는 막힌다.
    client_max_body_size 20m;

    # 도커 내장 DNS. proxy_pass 에 변수를 쓰면 nginx 가 업스트림을 "요청할 때마다" 다시 찾는다.
    # 변수 없이 proxy_pass http://app:8080 으로 적으면 기동 시점에 IP를 한 번만 박아두기 때문에,
    #   ① app 컨테이너를 재배포해 IP가 바뀌면 nginx 를 재시작할 때까지 502 가 영구히 남고
    #   ② app 이 아직 없는 상태로 nginx 가 뜨면 기동 자체가 실패한다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_app app:8080;

    # ⚠️ App Links 검증 파일. 구글 서버가 이걸 가져가 앱 서명 지문을 대조한다.
    #    리다이렉트나 인증이 끼면 검증이 조용히 실패하고 NFC 태그가 브라우저로 샌다.
    location /.well-known/assetlinks.json {
        # 변수를 쓰면 nginx 가 URI 를 자동으로 이어붙이지 않으므로 $request_uri 를 명시한다.
        proxy_pass http://$upstream_app$request_uri;
        proxy_set_header Host $host;
        default_type application/json;
    }

    location / {
        proxy_pass http://$upstream_app$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 이게 없으면 Spring 이 자기를 http 로 알고 리다이렉트 URL 을 http 로 만들어낸다.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
