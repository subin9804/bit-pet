# 운영 스택 — Lightsail 단일 인스턴스
#
# 로컬 개발용 bitpet_server/docker-compose.yml 과는 별개 파일이다. 합치지 말 것:
#   - 로컬은 DB/Redis 포트를 호스트에 열어야 한다 (서버가 호스트에서 직접 돌므로)
#   - 운영은 정반대로 절대 열면 안 된다 (인터넷에 노출된 인스턴스다)
#
# 실행: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

name: tailog

services:
  postgres:
    image: postgres:16-alpine
    container_name: tailog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    # ⚠️ ports 를 뚫지 않는다. app 컨테이너가 같은 네트워크에서 postgres:5432 로 붙는다.
    #    5432 를 호스트에 열면 인터넷에서 DB가 직접 보인다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tailog-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    # 헬스체크가 컨테이너 안에서 $REDIS_PASSWORD 를 읽는다. 이 블록이 없으면 빈 값이 되어
    # redis-cli -a "" 가 WRONGPASS 로 떨어지고, redis 는 멀쩡한데 계속 unhealthy 로 남는다.
    # app 이 depends_on: redis(service_healthy) 라 그대로 기동이 막힌다.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    # ⛔ build: 를 되살리지 말 것. 이미지는 GitHub Actions 가 만들어 GHCR 에 올리고
    #    서버는 받기만 한다. 2GB 인스턴스에서 Gradle 빌드를 돌리면 빌드 몇 분 동안
    #    API 응답이 같이 느려지고, 스왑이 모자라면 OOM Killer 가 postgres 를 죽인다.
    #
    # IMAGE_TAG 는 커밋 SHA 다. latest 를 쓰지 않는 이유는 롤백 때문 — 태그가 고정
    # 값이면 "어제 이미지로 되돌리기"가 성립하지 않는다.
    image: ghcr.io/subin9804/tailog-app:${IMAGE_TAG:-latest}
    # ⛔ container_name 을 되살리지 말 것. 이름을 고정하면 같은 서비스를 2개로
    #    띄울 수 없어(--scale) 무중단 배포가 원천 봉쇄된다.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod

      BITPET_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      BITPET_DB_USERNAME: ${POSTGRES_USER}
      BITPET_DB_PASSWORD: ${POSTGRES_PASSWORD}

      BITPET_REDIS_HOST: redis
      BITPET_REDIS_PORT: 6379
      BITPET_REDIS_PASSWORD: ${REDIS_PASSWORD}

      BITPET_JWT_SECRET: ${BITPET_JWT_SECRET}
      BITPET_TOKEN_ENC_KEY: ${BITPET_TOKEN_ENC_KEY}

      # 실제 AWS S3. S3Config 가 endpointOverride 를 무조건 적용하므로 리전 엔드포인트를 명시하고,
      # path-style 은 반드시 false 여야 한다 (LocalStack 에서만 true 였다).
      BITPET_S3_ENDPOINT: ${BITPET_S3_ENDPOINT}
      BITPET_S3_REGION: ${BITPET_S3_REGION}
      BITPET_S3_BUCKET: ${BITPET_S3_BUCKET}
      BITPET_S3_ACCESS_KEY: ${BITPET_S3_ACCESS_KEY}
      BITPET_S3_SECRET_KEY: ${BITPET_S3_SECRET_KEY}
      BITPET_S3_PATH_STYLE: "false"

      # 소셜 로그인 키. 없으면 application.yml 의 자리표시자가 쓰여 기동은 되고
      # 소셜 로그인만 동작하지 않는다 (첫 배포는 이메일 로그인만 내보낸다).
      # 값을 넣을 땐 각 콘솔에 https://tailog.me/login/oauth2/code/{provider} 를
      # 리다이렉트 URI 로 먼저 등록해야 한다.
      BITPET_OAUTH_GOOGLE_CLIENT_ID: ${BITPET_OAUTH_GOOGLE_CLIENT_ID:-not-configured}
      BITPET_OAUTH_GOOGLE_CLIENT_SECRET: ${BITPET_OAUTH_GOOGLE_CLIENT_SECRET:-not-configured}
      BITPET_OAUTH_KAKAO_CLIENT_ID: ${BITPET_OAUTH_KAKAO_CLIENT_ID:-not-configured}
      BITPET_OAUTH_KAKAO_CLIENT_SECRET: ${BITPET_OAUTH_KAKAO_CLIENT_SECRET:-not-configured}
      BITPET_OAUTH_NAVER_CLIENT_ID: ${BITPET_OAUTH_NAVER_CLIENT_ID:-not-configured}
      BITPET_OAUTH_NAVER_CLIENT_SECRET: ${BITPET_OAUTH_NAVER_CLIENT_SECRET:-not-configured}
      BITPET_OAUTH_SUCCESS_REDIRECT: ${BITPET_OAUTH_SUCCESS_REDIRECT:-https://tailog.me/oauth/callback}
      BITPET_OAUTH_FAILURE_REDIRECT: ${BITPET_OAUTH_FAILURE_REDIRECT:-https://tailog.me/oauth/error}

      MAIL_FROM: ${MAIL_FROM}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      # NFC 딥링크 검증용 지문. 업로드 키와 Play 앱 서명 키 둘 다 넣어야 한다.
      BITPET_ANDROID_SHA256: ${BITPET_ANDROID_SHA256}

      BITPET_FCM_ENABLED: ${BITPET_FCM_ENABLED:-true}
      BITPET_FCM_CREDENTIALS: /app/secrets/firebase-service-account.json
    volumes:
      - ./secrets:/app/secrets:ro
    expose:
      - "8080"
    # 2GB 인스턴스에서 postgres/redis/nginx 와 나눠 쓴다. 한도를 안 주면 앱이 다 먹고 OOM Killer 가 DB를 죽인다.
    mem_limit: 900m

  nginx:
    image: nginx:1.27-alpine
    container_name: tailog-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    # 갱신된 인증서는 재적재해야 적용된다. certbot 이 파일만 갈아끼우고 nginx 는 옛 인증서를
    # 메모리에 들고 있으므로, 주기적으로 reload 하지 않으면 90일 뒤 만료된 인증서를 계속 내민다.
    command: >
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done &
             nginx -g 'daemon off;'"

  # 인증서 자동 갱신. 12시간마다 깨어나 만료 30일 이내면 갱신한다.
  certbot:
    image: certbot/certbot:latest
    container_name: tailog-certbot
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!}; done"

volumes:
  postgres-data:
  redis-data:
  certbot-www:
  certbot-conf:
